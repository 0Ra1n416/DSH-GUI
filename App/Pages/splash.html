<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DeepSeek Harness</title>
    <style>
        :root {
            --brand: #4D6BFE;
            --brand-soft: #8AA4FF;
            --text-hi: #EDF1F8;
            --text-lo: #8593AD;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            cursor: default;
        }

        /* ===== 圆角卡片（窗口整体透明，只有卡片可见） ===== */
        .card {
            position: absolute;
            inset: 30px;   /* 四周留白，让 CSS 阴影在透明窗口内可见 */
            border-radius: 22px;
            overflow: hidden;
            background:
                radial-gradient(120% 90% at 50% -10%, rgba(77, 107, 254, 0.16), transparent 60%),
                linear-gradient(180deg, #10141f 0%, #0b0e16 100%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 12px 32px rgba(2, 6, 23, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: card-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 背景呼吸光斑 */
        .card::before,
        .card::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(46px);
            z-index: 0;
        }

        .card::before {
            width: 210px;
            height: 210px;
            top: -90px;
            right: -70px;
            background: radial-gradient(circle, rgba(77, 107, 254, 0.5), transparent 65%);
            animation: breathe 5.5s ease-in-out infinite;
        }

        .card::after {
            width: 170px;
            height: 170px;
            bottom: -80px;
            left: -60px;
            background: radial-gradient(circle, rgba(138, 164, 255, 0.35), transparent 65%);
            animation: breathe 5.5s ease-in-out infinite reverse;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                opacity: 0.45;
            }
            50% {
                transform: scale(1.12);
                opacity: 0.75;
            }
        }

        /* ===== 中央动画区 ===== */
        .mark {
            position: relative;
            z-index: 1;
            width: 132px;
            height: 132px;
            display: grid;
            place-items: center;
            margin-bottom: 26px;
            animation: float 3.6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* 旋转渐变光环 */
        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    rgba(77, 107, 254, 0) 0%,
                    rgba(77, 107, 254, 0.95) 18%,
                    rgba(138, 164, 255, 0.9) 32%,
                    rgba(77, 107, 254, 0) 50%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            animation: spin 1.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 呼吸光晕 */
        .halo {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(77, 107, 254, 0.28) 0%, rgba(77, 107, 254, 0) 70%);
            animation: pulse 2.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.92);
                opacity: 0.55;
            }
            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        /* 磨砂 Logo 底座 */
        .tile {
            position: relative;
            width: 92px;
            height: 92px;
            border-radius: 24px;
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.09);
            display: grid;
            place-items: center;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 10px 30px rgba(3, 8, 30, 0.45);
        }

        .logo {
            width: 52px;
            height: 52px;
            filter: drop-shadow(0 4px 14px rgba(77, 107, 254, 0.45));
        }

        .logo path {
            fill: url(#logoGrad);
        }

        /* ===== 文字区 ===== */
        .title {
            position: relative;
            z-index: 1;
            font-size: 21px;
            font-weight: 600;
            letter-spacing: 0.4px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #f4f7ff 0%, #b9c6e8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            letter-spacing: 1.5px;
            color: var(--text-lo);
        }

        .dots {
            display: inline-flex;
            gap: 5px;
        }

        .dots i {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--brand-soft);
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dots i:nth-child(2) {
            animation-delay: 0.18s;
        }

        .dots i:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.45;
            }
            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* 底部流光进度线 */
        .shimmer {
            position: absolute;
            left: 12%;
            right: 12%;
            bottom: 26px;
            z-index: 1;
            height: 2px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
        }

        .shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 38%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, var(--brand), var(--brand-soft), transparent);
            animation: slide 1.9s ease-in-out infinite;
        }

        @keyframes slide {
            0% {
                left: -38%;
            }
            100% {
                left: 100%;
            }
        }
    </style>
</head>

            </div>
        </div>

        <div class="title">DeepSeek Harness</div>
        <div class="status" style="font-size: 16px; margin-top: 6px;">启动中<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
        <div class="status" style="font-size: 8px; margin-top: 6px;">第一次启动较慢，请耐心等待</div>

    </div>
